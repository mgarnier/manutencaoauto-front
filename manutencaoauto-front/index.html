<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ManutençãoAuto Front</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <div class="bg-shape bg-shape-a" aria-hidden="true"></div>
  <div class="bg-shape bg-shape-b" aria-hidden="true"></div>

  <header class="app-header">
    <div class="brand-wrap">
      <h1>ManutençãoAuto</h1>
      <p>Gestão de manutenções, serviços e associações</p>
    </div>
    <div class="api-config">
      <label for="api-base-url">API base URL</label>
      <div class="api-config-controls">
        <input id="api-base-url" type="text" value="http://localhost:5000" aria-label="API base URL">
        <button id="save-api-url" type="button">Aplicar</button>
      </div>
    </div>
  </header>

  <main class="app-main">
    <nav class="tabs" aria-label="Navegação principal">
      <a href="#/manutencoes" class="tab-link" data-route="/manutencoes">Manutenções</a>
      <a href="#/servicos" class="tab-link" data-route="/servicos">Serviços</a>
      <a href="#/associacoes" class="tab-link" data-route="/associacoes">Associações</a>
    </nav>

    <section id="global-feedback" class="feedback hidden" role="status" aria-live="polite"></section>

    <section id="app-view" class="view-container" aria-live="polite"></section>
  </main>

  <footer class="app-footer">
    <small>SPA sem frameworks JavaScript. Abra este arquivo diretamente para visualizar a estrutura estática.</small>
  </footer>

  <script src="./js/config.js"></script>
  <script src="./js/utils.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/views/manutencoes.js"></script>
  <script src="./js/views/servicos.js"></script>
  <script src="./js/views/associacoes.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
